loss: reverse_kl
student_model: /path/to/Qwen3.5-2B
teacher_model: /path/to/Qwen3.5-9B
train_dataset: /path/to/dataset_with_gold_prefix
eval_dataset: /path/to/omni_math_4_5/test.jsonl
output_dir: results/qwen3_5_2b_9b_hybrid

distributed_strategy: zero2
max_pack_tokens: 65536

learning_rate: 5e-6
global_batch_size: 128

# CUDA graph is enabled for Qwen3.5: _decode_deltanet uses chunk_gated_delta_rule
# with T=1 (FLA installed) or a vectorised PyTorch einsum (fallback) — both paths
# are graph-safe.  Omitting generation_cuda_graph_max_bs lets the engine
# auto-detect the limit (256 on H200, 160 otherwise).  Set to 0 to force eager.

generation_mem_fraction_static: 0.85
generation_max_running_req: 128
generation_page_size: 16
generation_attention_backend: fi
generation_admission_reserve_tokens: 2048
generation_max_preemptions_per_req: 3

enable_gradient_checkpointing: true
temperature: 0.6
top_p: 0.9
generation_top_k: 20
max_total_tokens: 16384
train_subset_size: 100000
eval_subset_size: 200
validation_subset_size: 200
eval_every_steps: 50
kl_backward_mode: two_stage
log_every: 1
max_steps: 400
num_epochs: 1
save_every_steps: 100
skip_eval: false

# ---------------------------------------------------------------------------
# Hybrid SFT + OPD settings
# ---------------------------------------------------------------------------
#
# Training mode: for each sample the response is split into two regions:
#
#   [base prompt | gold_prefix          | continuation (student-generated)]
#                  <── SFT (CE loss) ──>  <── OPD (KL loss) ─────────────>
#
# The gold prefix is taken from the dataset field named below and embedded
# into the prompt via continue_final_message=True so the rollout engine
# generates only the continuation after it.
#
# Set gold_prefix_field to null (or omit it) to disable hybrid mode and
# run standard OPD.

# Dataset field that contains the gold-prefix text.
# Example dataset schema:
#   {"question": "...", "gold_prefix": "Let me think step by step:\n1. ...", "answer": "..."}
gold_prefix_field: gold_prefix

# Optional hard cap on gold-prefix length in tokens.
# Prefixes longer than this are truncated at the token boundary.
# Set to null for no cap.
gold_prefix_max_tokens: 512

# Relative weight of the SFT (CE) loss vs. the OPD (KL) loss.
# Both losses are token-count-normalised before weighting, so:
#   1.0  → equal per-token influence (recommended starting point)
#   2.0  → SFT tokens contribute twice as much gradient as OPD tokens
#   0.5  → OPD tokens dominate
sft_loss_weight: 1.0
