[project]
name = "liteopd"
version = "0.1.0"
description = "Lite-OPD: On-Policy Distillation"
requires-python = ">=3.12"
dependencies = [
  "torch",
  "transformers",
  "datasets>=3.0.0",
  "huggingface_hub>=0.30.0",
  "accelerate",
  "flashinfer-python",
  "orjson",
  "openai",
  "fastapi",
  "uvloop",
  "pyzmq",
  "pillow",
  "pydantic",
  "tqdm",
  "pyyaml",
  "numpy",
  "pandas",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "basedpyright",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
